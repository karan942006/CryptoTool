name: Deploy CryptoTool to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (Root)
        run: npm install

      - name: Build Web Application
        run: npm run build --prefix apps/web
        env:
          VITE_SUPABASE_URL: https://gqeajddogocglfacohwa.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxZWFqZGRvZ29jZ2xmYWNvaHdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMjI5ODYsImV4cCI6MjEwMzU5ODk4Nn0.1NZvp5w7VxczKSYzBd0b2malwZAsz6BucYPGv0yXnW0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/web/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
