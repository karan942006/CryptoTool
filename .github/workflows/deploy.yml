name: Deploy CryptoTool to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build React app
        run: npm run build
        working-directory: apps/web
        env:
          VITE_SUPABASE_URL: https://gqeajddogocglfacohwa.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxZWFqZGRvZ29jZ2xmYWNvaHdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMjI5ODYsImV4cCI6MjEwMzU5ODk4Nn0.1NZvp5w7VxczKSYzBd0b2malwZAsz6BucYPGv0yXnW0

      - name: Prepare deployment artifacts
        run: |
          # Add .nojekyll to bypass Jekyll processing
          touch apps/web/dist/.nojekyll
          # Add 404.html for SPA client-side routing support
          cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
